<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ADHD tasks">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>ADHD Study iPad Tasks</title>
<style>
:root{--bg:#000;--fg:#f2f2f2;--muted:#9a9a9a;--card:#141414;--line:#2a2a2a;--accent:#5aa9ff;--accent-ink:#00172e;--warn:#ffd24d;--danger:#ff7070;--ok:#6fd38a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px 60px}
h1{font-size:28px;margin:8px 0 6px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px;margin:0 0 14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:17px}
.row > span{flex:0 0 170px;color:#ddd}
input,select{font:inherit;font-size:17px;color:var(--fg);background:#0b0b0b;border:1px solid #343434;border-radius:10px;padding:9px 12px;flex:1;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-size:17px;font-weight:600;background:#2b2b2b;color:var(--fg);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:#3a1515;color:#ffb3b3}
.btn.small{font-size:15px;padding:8px 13px;border-radius:10px}
.btn:disabled{opacity:.35}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.err{color:var(--danger);font-size:15px;min-height:20px;margin-top:6px}
.who{font-size:30px;font-weight:700}
.meta{color:#ccc;font-size:16px;margin-top:4px;line-height:1.5}
.warn{color:var(--warn)}
.task{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task img{width:52px;height:52px;border-radius:12px;flex:0 0 auto}
.task .grow{flex:1;min-width:0}
.task b{display:block;font-size:19px}
.task .st{font-size:15px;color:var(--muted);margin-top:3px}
.task .st.ok{color:var(--ok)}
.task .st.mid{color:var(--warn)}
.num{display:inline-block;width:26px;height:26px;border-radius:13px;background:#262626;text-align:center;line-height:26px;font-size:14px;font-weight:700;margin-right:8px;vertical-align:2px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
td .btn{margin:2px 0}
details summary{cursor:pointer;color:#ddd;font-size:16px;padding:4px 0}
a{color:var(--accent)}
.hidden{display:none !important}
.btn.big{font-size:20px;padding:15px 40px}
.head{display:flex;align-items:flex-start;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.head .grow{flex:1}
.saveRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ok{color:var(--ok)}
details.more{padding:12px 18px}
details.more > summary{font-size:16px;color:#ccc}
details.more[open] > summary{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ADHD study</h1>

  <!-- no current participant -->
  <div class="card" id="newCard">
    <label class="row"><span>Participant ID</span><input id="pid" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. P001"></label>
    <label class="row"><span>Hand used</span><select id="hand"><option value="right">Right</option><option value="left">Left</option></select></label>
    <div class="err" id="err"></div>
    <div class="btns"><button class="btn primary big" id="startBtn">Start session</button></div>
  </div>

  <!-- current participant -->
  <div id="sessView" class="hidden">
    <div class="card">
      <div class="head">
        <div class="grow"><div class="who" id="who"></div><div class="meta" id="whoMeta"></div></div>
        <button class="btn small danger" id="endBtn">End session</button>
      </div>
      <div id="taskList"></div>
    </div>
    <div class="card">
      <div class="saveRow"><button class="btn primary" id="saveAllBtn">Save data…</button><span class="meta" id="saveMeta"></span></div>
    </div>
  </div>

  <details class="card more" id="allCard"><summary>All data on this iPad</summary>
    <div class="meta" id="storeMeta"></div>
    <div id="allData"></div>
    <div class="btns"><button class="btn small danger" id="delExportedBtn">Delete runs that have been saved</button></div>
  </details>

  <p class="sub">Run everything from this page's home-screen icon. Set-up steps: <a href="https://github.com/neural-control-and-computation-lab/ADHD-ipad-tasks">github.com/neural-control-and-computation-lab/ADHD-ipad-tasks</a></p>
</div>

<script src="session.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TASK_ICONS = {gonogo: 'gonogo/icon.png', story: 'story/icon.png'};

/* Counterbalanced task order: odd-numbered IDs start with go/no-go, even-numbered with storytelling. */
function taskOrder(pid){
  const m = String(pid).match(/(\d+)\D*$/);
  let odd;
  if (m) odd = parseInt(m[1], 10) % 2 === 1;
  else { let h = 0; for (const ch of String(pid)) h = (h*31 + ch.charCodeAt(0)) >>> 0; odd = h % 2 === 1; }   // no number in the ID
  return odd ? ['gonogo', 'story'] : ['story', 'gonogo'];
}
/* The storytelling task downloads its films and stories the first time it opens, and notes here whether it has them. */
const MEDIA_MISSING = 'Films and stories not downloaded yet: open this task once on Wi-Fi.';
function storyMediaReady(){ try { const m = JSON.parse(Session.lsGet('storyTask:media')); return !!(m && m.ready); } catch(e){ return false; } }
function statusFor(recs){
  if (!recs.length) return {cls: '', text: 'Not started'};
  const r = recs[0], sum = r.summary ? ' · ' + r.summary : '';
  if (r.status === 'finished') return {cls: 'ok', text: 'Done' + sum};
  if (r.status === 'ended early') return {cls: 'mid', text: 'Ended early' + sum};
  return {cls: 'mid', text: 'Not finished' + sum};
}
function render(){
  const s = Session.current();
  $('newCard').classList.toggle('hidden', !!s);
  $('sessView').classList.toggle('hidden', !s);
  const all = Session.records();
  if (s){
    $('who').textContent = s.participant;
    const age = s.started_iso ? (Date.now() - Date.parse(s.started_iso))/36e5 : 0;
    $('whoMeta').innerHTML = `${s.hand === 'left' ? 'Left' : 'Right'} hand` +
      (age > 12 ? `<br><span class="warn">Started more than 12 hours ago. End it if this is a new participant.</span>` : '');
    const box = $('taskList'); box.innerHTML = '';
    const mine = all.filter(r => r.participant === s.participant && r.visit === s.visit);
    let nextMarked = false;
    taskOrder(s.participant).forEach((id, i) => {
      const t = Session.TASKS.find(x => x.id === id);
      const recs = mine.filter(r => r.taskId === id);
      const st = statusFor(recs);
      const done = recs.some(r => r.status === 'finished');
      const row = document.createElement('div'); row.className = 'task';
      row.innerHTML = `<img src="${TASK_ICONS[id]}" alt=""><div class="grow"><b><span class="num">${i+1}</span>${esc(t.name)}</b><div class="st ${st.cls}">${esc(st.text)}</div>` +
        (id === 'story' && !done && !storyMediaReady() ? `<div class="st mid">${MEDIA_MISSING}</div>` : '') + '</div>';
      const b = document.createElement('button'); b.className = 'btn' + (!done && !nextMarked ? ' primary' : '');
      if (!done) nextMarked = true;
      b.textContent = recs.length ? 'Open again' : 'Open';
      b.onclick = () => location.assign(Session.taskLink(t, s));
      row.appendChild(b); box.appendChild(row);
    });
    const pRecs = all.filter(r => r.participant === s.participant), unsaved = pRecs.filter(r => !r.exported).length;
    $('saveAllBtn').disabled = !pRecs.length;
    $('saveMeta').innerHTML = !pRecs.length ? 'No data yet.' :
      unsaved ? `${unsaved} file${unsaved === 1 ? '' : 's'} not saved yet.` : '<span class="ok">All saved.</span>';
  }
  const used = Session.storageUsed();
  $('storeMeta').innerHTML = `${all.length} task run${all.length === 1 ? '' : 's'}, ${all.filter(r => !r.exported).length} not saved yet. ` +
    `About ${(used/1024).toFixed(0)} KB of the browser's ~5 MB limit used` +
    (used > 3.5e6 ? '. <span class="warn">Storage is getting full: save, then delete old runs.</span>' : '.') +
    '<br>' + (storyMediaReady() ? 'Storytelling films and stories: on this iPad.' : '<span class="warn">Storytelling films and stories: not downloaded yet. Open that task once on Wi-Fi.</span>');
  $('allData').innerHTML = all.length ? table(all) : '<p class="sub" style="margin:8px 0 0">Nothing saved yet.</p>';
  bindRows($('allData'), all);
}
function table(recs){
  return `<table><tr><th>ID</th><th>Task</th><th>Started</th><th>Status</th><th></th></tr>` +
    recs.map((r, i) => `<tr><td>${esc(r.participant)}</td><td>${esc(r.taskName)}</td><td>${esc(r.started_local || r.session)}</td>` +
      `<td>${esc(r.status || 'in progress')}${r.exported ? ' · <span class="ok">saved</span>' : ' · <span class="warn">not saved</span>'}</td>` +
      `<td style="text-align:right;white-space:nowrap"><button class="btn small" data-act="save" data-i="${i}">Save</button> <button class="btn small danger" data-act="del" data-i="${i}">Delete</button></td></tr>`).join('') + '</table>';
}
function bindRows(box, recs){
  box.querySelectorAll('button[data-act]').forEach(b => {
    const r = recs[+b.dataset.i];
    b.onclick = async () => {
      if (b.dataset.act === 'save'){ if (await Session.exportFiles([{name: r.filename, text: r.csv}])) Session.markExported([r.key]); render(); }
      else if (confirm(`Delete ${r.taskName} data for ${r.participant} (${r.started_local || r.session}) from this iPad?` + (r.exported ? '' : '\n\nThis run has NOT been saved anywhere else.'))){ Session.lsDel(r.key); render(); }
    };
  });
}
$('startBtn').onclick = () => {
  const pid = $('pid').value.trim();
  if (!pid){ $('err').textContent = 'Enter a participant ID.'; return; }
  if (!Session.validId(pid)){ $('err').textContent = 'Use letters, numbers, - or _ only.'; return; }
  const earlier = Session.records().filter(r => r.participant === pid);
  if (earlier.length && !confirm(`There is already data for ${pid} on this iPad. Start a new session for ${pid} anyway?`)) return;
  $('err').textContent = '';
  Session.start({participant: pid, hand: $('hand').value});
  render();
};
$('pid').addEventListener('keydown', e => { if (e.key === 'Enter') $('startBtn').click(); });
$('endBtn').onclick = () => {
  const s = Session.current(); if (!s) return;
  const unsaved = Session.records().filter(r => r.participant === s.participant && !r.exported).length;
  if (!confirm(`End the session for ${s.participant}?` + (unsaved ? `\n\n${unsaved} file(s) for this participant have not been saved yet. They stay on the iPad.` : ''))) return;
  Session.end(); $('pid').value = ''; render();
};
$('saveAllBtn').onclick = async () => {
  const s = Session.current(); if (!s) return;
  const recs = Session.records().filter(r => r.participant === s.participant);
  if (await Session.exportFiles(recs.map(r => ({name: r.filename, text: r.csv})))) Session.markExported(recs.map(r => r.key));
  render();
};
$('delExportedBtn').onclick = () => {
  const ex = Session.records().filter(r => r.exported);
  if (!ex.length){ alert('No saved runs to delete.'); return; }
  if (confirm(`Delete ${ex.length} task run(s) that have already been saved?`)){ ex.forEach(r => Session.lsDel(r.key)); render(); }
};
addEventListener('pageshow', render);          // refresh statuses when coming back from a task
render();
</script>
</body>
</html>
